services:

  # migrations
  migrations:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./migrations", "migrate:up" ]
    restart: "no"
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # core application
  api:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./api" ]
    restart: unless-stopped
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
      LISTEN_PORT: "8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - internal

  connector:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./connector" ]
    restart: unless-stopped
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
      LISTEN_PORT: "8001"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CONNECTOR_PORT:-8001}:8001"
    networks:
      - internal

  outbox_worker:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./outbox_worker" ]
    restart: unless-stopped
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # adapters — only start when their type is listed in COMPOSE_PROFILES
  adapter_mailgun:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./adapter_mailgun" ]
    profiles: [ "mailgun" ]
    restart: unless-stopped
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
      LISTEN_PORT: "8002"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ADAPTER_MAILGUN_PORT:-8002}:8002"
    networks:
      - internal

  adapter_voiso:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./adapter_voiso" ]
    profiles: [ "voiso" ]
    restart: unless-stopped
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
      LISTEN_PORT: "8003"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${ADAPTER_VOISO_PORT:-8003}:8003"
    networks:
      - internal

  adapter_sms_retail:
    image: ghcr.io/moai-team-llc/player-pulse-backend-on-premise:1.1.0
    command: [ "./adapter_sms_retail" ]
    profiles: [ "sms-retail" ]
    restart: unless-stopped
    env_file: .env
    environment:
      PGX_DATABASE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_ADDRESS: redis:6379
      LISTEN_PORT: "8004"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ADAPTER_SMS_RETAIL_PORT:-8004}:8004"
    networks:
      - internal

  # frontend
  frontend:
    image: ghcr.io/moai-team-llc/player-pulse-frontend-on-premise:1.1.0
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - internal

  superadmin:
    image: ghcr.io/moai-team-llc/player-pulse-super-admin-on-premise:1.0.0
    restart: unless-stopped
    ports:
      - "${SUPERADMIN_PORT:-3001}:80"
    networks:
      - internal

  # infrastructure
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        printf "bind 0.0.0.0\nappendonly yes\nappendfsync everysec\ndir /data\nmaxmemory $$REDIS_MAX_MEMORY\nmaxmemory-policy allkeys-lru\n" > /usr/local/etc/redis/redis.conf &&
        printf "user default on >%s ~* &* +@all\n" "$$REDIS_PASSWORD" > /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - internal

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing minio/${S3_BUCKET};
        printf "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::${S3_BUCKET}\",\"arn:aws:s3:::${S3_BUCKET}/*\"]}]}" > /tmp/policy.json;
        mc admin policy create minio player-pulse-app /tmp/policy.json || true;
        mc admin user add minio ${S3_ACCESS_KEY} ${S3_SECRET_KEY} || true;
        mc admin policy attach minio player-pulse-app --user ${S3_ACCESS_KEY} || true;
      '
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  internal:
    driver: bridge